<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px "Segoe UI", system-ui, sans-serif; width: 360px; margin: 0; color: #222; }
  header { background: #1f6fd1; color: #fff; padding: 10px 14px; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  header button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
  main { padding: 12px 14px 14px; }
  #title { font-weight: 600; margin-bottom: 10px; line-height: 1.35; word-break: break-word; }
  .card { border: 1px solid #dde3ea; border-radius: 8px; padding: 9px 10px; margin: 8px 0; }
  .card.best { border-color: #1f6fd1; background: #f3f8ff; }
  .kind { font-weight: 600; }
  .meta { color: #666; font-size: 12px; margin: 3px 0 7px; word-break: break-all; }
  .row { display: flex; gap: 6px; }
  select { flex: 1; padding: 4px; }
  button.dl { flex: 1; padding: 7px; border: 0; border-radius: 6px; background: #1f6fd1; color: #fff; font-weight: 600; cursor: pointer; }
  button.dl:disabled { background: #9bb9e3; cursor: default; }
  .empty { color: #555; line-height: 1.5; }
  .err { color: #c4302b; }
  .hint { color: #777; font-size: 12px; margin-top: 10px; line-height: 1.4; }
</style>
</head>
<body>
<header><span>Vidéo DL</span><button id="clear" title="Oublier les vidéos détectées sur cet onglet">Vider</button></header>
<main>
  <div id="title">…</div>
  <div id="list"></div>
  <div id="status"></div>
</main>
<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>

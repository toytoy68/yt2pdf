name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilation
        run: gradle assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk yt2pdf.apk

      - name: Paquet de l'extension Chrome
        run: cd chrome-extension && zip -qr ../yt2pdf-chrome.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: yt2pdf-apk
          path: yt2pdf.apk

      # Publie l'APK dans « Releases » : téléchargeable directement depuis le téléphone
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YT → PDF (build ${{ github.run_number }})
          files: |
            yt2pdf.apk
            yt2pdf-chrome.zip
